# Camera-side configuration.
#
# Nothing environment-specific belongs in source. Paths, expected formats,
# thresholds and the team number all live here, as values.
#
# The team number appears in exactly one place in this project. If this file is
# missing, the tools say so and fail - they never quietly assume a team.

camera:
  # Stable path. /dev/videoN moves when a device is replugged or a second
  # camera appears; the by-id name carries the serial and does not.
  by_id: /dev/v4l/by-id/usb-DCX-260513-K_Thrifty_01.00.00-video-index0
  fallback: /dev/video0
  serial: DCX-260513-K
  model: thriftiest-cam        # OV9281, 1MP mono global shutter, USB 2.0, 80 deg lens

  # What the camera should be delivering. preflight compares reality to this.
  expect:
    width: 1280
    height: 800
    fourcc: MJPG
    min_fps: 25.0

  # PhotonVision owns every v4l2 control that matters on this camera - Auto
  # Exposure, Exposure, Brightness, Auto White Balance and White Balance
  # Temperature are all in its Input tab, and it rewrites them when a pipeline
  # changes or restarts. Duplicating them here created a second source of truth
  # and a preflight failure that meant nothing, so the list is gone and the
  # PhotonVision settings export is what gets committed instead.
  #
  # Exposure is in units of 100us, so the UI's "120" is 12ms. Two measured
  # reference points, both for a 36h11 tag in the same room: the detection floor
  # was ~250 in daylight and ~820 at night. It is a property of the light, not
  # of the camera, so it is not a setting anything can hardcode.

  phantom_controls: [focus_absolute, focus_automatic_continuous, saturation, hue,
                     white_balance_temperature]

calibration:
  # Committed with serial and date in the filename. A calibration that cannot be
  # traced to a specific physical camera is worthless.
  file: thriftiest-DCX-260513-K-2026-08-24.json
  expect_hfov_deg: 82.0
  tolerance_deg: 2.0

photonvision:
  service: photonvision
  ui_port: 5800
  stream_ports: [1181, 1182]   # raw, processed - one pair per camera
  camera_name: front_left      # position, not brand; ends up in every NT topic
  nt_table: photonvision
  settings_dir: /opt/photonvision/photonvision_config

networktables:
  # With no roboRIO, enable "Run NetworkTables Server" in PhotonVision's
  # settings and leave this as client_address pointing at localhost.
  # Once a roboRIO exists it becomes the server: use client_team.
  #   server         - this tool runs the server (rare; only if nothing else does)
  #   client_team    - resolve the server from the team number
  #   client_address - connect to a fixed address
  mode: client_address
  team: 2609
  address: 127.0.0.1
  identity: camera_tools

preflight:
  require_clean_throttle: true
  require_photonvision: true
  require_nt: true
  # The check that matters. Everything else can pass while detection is dead:
  # exposure drifting below the light's detection floor produces no error
  # anywhere, just hasTarget going false. Set true when a tag is permanently in
  # view - on a robot at an event, it should be true.
  require_detections: false
  # Nothing is broken at a low framerate, but it is worth saying. Framerate here
  # is set by exposure and exposure is set by the light: 12 fps at night, 31 in
  # daylight, 42 with detection lost entirely.
  min_fps: 10
  nt_timeout_s: 5.0
